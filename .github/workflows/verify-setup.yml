name: Verify Instagram Setup

# Read-only preflight. Checks your secrets and your video WITHOUT posting.
# Run this before the first real publish.
on:
  workflow_dispatch:
    inputs:
      video_path:
        description: "Video to validate"
        default: "posts/reel.mp4"
      caption_file:
        description: "Caption file to validate"
        default: "posts/caption.txt"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check secrets are non-empty
        run: |
          MISSING=0
          [ -z "${{ secrets.IG_USER_ID }}" ] && { echo "::error::IG_USER_ID secret is missing"; MISSING=1; }
          [ -z "${{ secrets.IG_ACCESS_TOKEN }}" ] && { echo "::error::IG_ACCESS_TOKEN secret is missing"; MISSING=1; }
          [ "$MISSING" = "1" ] && exit 1
          echo "Both secrets exist."

      - name: Verify token + account
        id: verify
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python3 -u scripts/verify_setup.py

      # Keep going even if the token check failed, so one run shows you
      # every problem at once instead of one per re-run.
      - name: Validate video file
        if: always()
        run: python3 -u scripts/check_reel.py "${{ github.event.inputs.video_path || 'posts/reel.mp4' }}"

      - name: Preview the caption
        if: always()
        run: |
          F="${{ github.event.inputs.caption_file || 'posts/caption.txt' }}"
          if [ ! -f "$F" ]; then
            echo "::warning::$F not found -- reels would post with no caption"
            exit 0
          fi
          python3 - "$F" <<'PY'
          import sys, re
          p = sys.argv[1]
          t = open(p, encoding="utf-8").read().strip()
          tags = len(re.findall(r"#\w+", t))
          print(f"{p}: {len(t)} chars, {tags} hashtags")
          print("[FAIL] over 2200 chars" if len(t) > 2200 else "[ OK ] within 2200 chars")
          print("[FAIL] over 30 hashtags" if tags > 30 else "[ OK ] within 30 hashtags")
          print("[ OK ] not empty" if t else "[FAIL] empty")
          print("\n----- caption preview -----")
          print(t)
          print("---------------------------")
          PY

      - name: Confirm the public URL Meta will fetch
        if: always()
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY##*/}"
          python3 -u scripts/resolve_url.py \
            "${{ github.event.inputs.video_path || 'posts/reel.mp4' }}" \
            "$OWNER" "$REPO" "$(git rev-parse HEAD)"
