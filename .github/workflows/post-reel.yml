name: Post Reel to Instagram

on:
  # Daily at 12:30 UTC = 18:00 IST. Cron is always UTC.
  schedule:
    - cron: "30 6 * * *"
  # Manual run button in the Actions tab
  workflow_dispatch:
    inputs:
      video_path:
        description: "Path in the CDN repo, e.g. posts/reel.mp4"
        default: "posts/reel.mp4"
      caption:
        description: "Caption override (leave blank to use posts/caption.txt)"
        default: ""
      caption_file:
        description: "Caption file in the repo"
        default: "posts/caption.txt"

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve public video URL
        id: url
        run: |
          # Probes several hosts and picks the first that returns 200/206
          # with a video/* content-type AND working range requests -- all
          # three are required by Meta's fetcher.
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY##*/}"
          python3 -u scripts/resolve_url.py \
            "${{ github.event.inputs.video_path || 'posts/reel.mp4' }}" \
            "$OWNER" "$REPO" "$(git rev-parse HEAD)"

      - name: Publish
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          VIDEO_URL: ${{ steps.url.outputs.video_url }}
          # Blank on scheduled runs, so the file is used automatically.
          CAPTION: ${{ github.event.inputs.caption }}
          CAPTION_FILE: ${{ github.event.inputs.caption_file || 'posts/caption.txt' }}
          SHARE_TO_FEED: "true"
          PYTHONUNBUFFERED: "1"
        run: python -u scripts/post_reel.py
